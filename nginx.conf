server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect root to /mqtt-explorer/
    location = / {
        return 301 /mqtt-explorer/;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        font/woff
        font/woff2
        image/svg+xml;

    # SPA fallback: serve index.html for all routes under /mqtt-explorer/
    location /mqtt-explorer/ {
        # Strip the prefix so files resolve under root
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /mqtt-explorer/index.html;
    }

    # Cache static assets aggressively (Vite hashes filenames)
    location ~* ^/mqtt-explorer/.*\.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Don't cache index.html
    location = /mqtt-explorer/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
}